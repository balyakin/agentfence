name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - run: go test ./...
      - run: mkdir -p dist
      - run: GOOS=linux GOARCH=amd64 go build -trimpath -o dist/agentfence-linux-amd64 ./cmd/agentfence
      - run: GOOS=linux GOARCH=arm64 go build -trimpath -o dist/agentfence-linux-arm64 ./cmd/agentfence
