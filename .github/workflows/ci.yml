name: ci

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - run: test -z "$(gofmt -l cmd internal pkg)"
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v6
        with:
          args: ./...
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...
      - run: go test ./...
      - run: go test -race ./...
      - run: go test -run TestLeakLab ./...
      - run: go build -trimpath ./cmd/agentfence
      - run: GOOS=linux GOARCH=amd64 go build -trimpath ./cmd/agentfence
      - run: GOOS=linux GOARCH=arm64 go build -trimpath ./cmd/agentfence

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - run: test -z "$(gofmt -l cmd internal pkg)"
      - run: go vet ./...
      - run: go test ./...
      - run: go build -trimpath ./cmd/agentfence
