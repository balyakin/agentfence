name: ci

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.4'
      - run: test -z "$(gofmt -l cmd internal pkg)"
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: ./...
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...
      - run: go test ./...
      - run: go test -race ./...
      - run: go test -run TestLeakLab ./...
      - run: go build -trimpath ./cmd/agentfence
      - run: GOOS=linux GOARCH=amd64 go build -trimpath ./cmd/agentfence
      - run: GOOS=linux GOARCH=arm64 go build -trimpath ./cmd/agentfence

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.4'
      - run: test -z "$(gofmt -l cmd internal pkg)"
      - run: go vet ./...
      - run: go test ./...
      - run: go build -trimpath ./cmd/agentfence
